name: Deterministic Maintenance (validated auto-commit)

on:
  schedule:
    # Monday–Saturday, 05:41 UTC = 11:11 IST (Asia/Kolkata).
    - cron: '41 5 * * 1-6'
  workflow_dispatch:
    inputs:
      mode:
        description: Preview changes, commit as owner, or approve an exact preview
        type: choice
        options: [preview, commit, approved]
        default: preview
      approved_digest:
        description: Exact review token from a validated preview (approved mode only)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: ai-maintenance-main
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    permissions:
      contents: write
    steps:
      - name: Checkout main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify committed Node version file
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if ! git ls-files --error-unmatch .nvmrc >/dev/null 2>&1 || [ ! -s .nvmrc ]; then
            echo "::error file=.nvmrc::Commit the root .nvmrc and start a new workflow run from that revision."
            exit 1
          fi
          if ! grep -Eq '^[0-9]+[[:space:]]*$' .nvmrc; then
            echo "::error file=.nvmrc::Expected a Node.js major version in the root .nvmrc."
            exit 1
          fi
          git log -1 --format='Validating checkout %h'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version-file: './.nvmrc'
          cache: npm
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Validate and apply deterministic maintenance
        id: agent
        run: python scripts/maintenance_agent.py
      - name: Review validated maintenance
        if: steps.agent.outputs.has_changes == 'true'
        id: review
        run: |
          set -euo pipefail
          python scripts/check_staged.py --stage
          git diff --cached --check
          git diff --cached --no-ext-diff
          DIGEST="$(PYTHONPATH=scripts python -c 'from maintenance_agent import approval_digest; print(approval_digest())')"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Review token: $DIGEST"
          echo "Changes detected and validated. Review token: \`$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit and push validated maintenance directly
        if: steps.agent.outputs.has_changes == 'true' && (github.event_name == 'schedule' || inputs.mode != 'preview')
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          APPROVED_DIGEST: ${{ inputs.approved_digest }}
          REVIEW_DIGEST: ${{ steps.review.outputs.digest }}
          # Owner-authorized identity for scheduled and manual maintenance commits.
          # Use an email linked to the owner's GitHub account (including noreply).
          MAINTENANCE_AUTHOR_EMAIL: ${{ secrets.MAINTENANCE_AUTHOR_EMAIL }}
        run: |
          set -euo pipefail
          # Stage only exact files covered by the successful validation receipt.
          python scripts/check_staged.py --stage
          if git diff --cached --quiet; then
            echo "No staged changes; skipping commit."
            exit 0
          fi
          git diff --cached --check
          if [ -z "$MAINTENANCE_AUTHOR_EMAIL" ]; then
            echo '::error::Set MAINTENANCE_AUTHOR_EMAIL to an email associated with Jyoti-bhardwaj0147 before committing.'
            exit 1
          fi
          git config user.name 'Jyoti-bhardwaj0147'
          git config user.email "$MAINTENANCE_AUTHOR_EMAIL"
          if [ "$MODE" = approved ]; then
            if [ "$GITHUB_EVENT_NAME" != workflow_dispatch ] ||
               [ "$GITHUB_ACTOR" != Jyoti-bhardwaj0147 ] ||
               [ "$GITHUB_TRIGGERING_ACTOR" != Jyoti-bhardwaj0147 ] ||
               [ -z "$APPROVED_DIGEST" ] || [ "$APPROVED_DIGEST" != "$REVIEW_DIGEST" ] ||
               [ -z "$MAINTENANCE_AUTHOR_EMAIL" ]; then
              echo '::error::Personal attribution requires owner approval of this exact review token and MAINTENANCE_AUTHOR_EMAIL.'
              exit 1
            fi
          fi
          # Fetch before commit; never rebase a diff onto an unvalidated base.
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" fetch origin refs/heads/main; then
            echo '::error::Fetch failed; no commit or push attempted.'
            exit 1
          fi
          if [ "$(git rev-parse FETCH_HEAD)" != "$(git rev-parse HEAD)" ]; then
            echo '::error::Main advanced; no commit created. Run again to validate the new base and renew any approval.'
            exit 1
          fi
          # Quiet avoids printing the personal author identity in the run log.
          # Git commit metadata necessarily retains the chosen author email.
          git commit --quiet -m 'chore: apply validated deterministic maintenance'
          echo "Commit successfully created: $(git rev-parse HEAD)"
          # Credentials are scoped to Git transport, never validation commands.
          if git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/main; then
            echo 'Push completed to main.'
          else
            echo '::error::Push failed. Check branch rules, token permissions, or concurrent updates. Start a fresh run; no force push or unvalidated rebase is attempted.'
            exit 1
          fi
      - name: No-change summary
        if: steps.agent.outputs.has_changes == 'false'
        run: echo 'Maintenance completed with no changes; no commit or push required.' >> "$GITHUB_STEP_SUMMARY"
