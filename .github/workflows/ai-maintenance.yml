name: AI Maintenance (validated auto-commit)

on:
  schedule:
    # Monday–Saturday, 05:41 UTC = 11:11 IST (Asia/Kolkata).
    - cron: '41 5 * * 1-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-maintenance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  maintain:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify committed Node version file
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          if ! git ls-files --error-unmatch .nvmrc >/dev/null 2>&1 || [ ! -s .nvmrc ]; then
            echo "::error file=.nvmrc::Commit the root .nvmrc and start a new workflow run from that revision."
            exit 1
          fi
          if ! grep -Eq '^[0-9]+[[:space:]]*$' .nvmrc; then
            echo "::error file=.nvmrc::Expected a Node.js major version in the root .nvmrc."
            exit 1
          fi
          git log -1 --format='Validating checkout %h'
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0 (Node 24)
        with:
          python-version: '3.12'
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node 24)
        with:
          node-version-file: './.nvmrc'
          cache: npm
          cache-dependency-path: './package-lock.json'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Baseline validation
        run: node scripts/validate-maintenance.mjs
      - name: Propose guarded edits
        id: agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAINTENANCE_MODEL: ${{ vars.MAINTENANCE_MODEL || 'gpt-5.5' }}
        run: python scripts/maintenance_agent.py
      - name: Validate suggested changes
        if: steps.agent.outputs.has_changes == 'true'
        run: |
          git diff --check
          node scripts/validate-maintenance.mjs
      - name: Commit and push validated maintenance directly
        if: steps.agent.outputs.has_changes == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Baseline requires a clean tree; the agent can edit only allowlisted paths.
          git add -A
          # Reject any staged path outside the same allowlist enforced by the agent.
          python scripts/check_staged.py
          if git diff --cached --quiet; then
            echo "No staged changes; skipping commit."
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: apply validated AI maintenance improvement'
          # Supply credentials only for push, never to generated code validation.
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH_HEADER"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
